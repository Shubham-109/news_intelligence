name: news_intelligence
description: "A business news intelligence app built with Flutter, Riverpod and Hive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter_riverpod: ^3.0.1
  hive_ce: ^2.11.0
  html: ^0.15.5
  intl: ^0.20.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Gelasio
      fonts:
        - asset: assets/fonts/gelasio/Gelasio-Regular.ttf
        - asset: assets/fonts/gelasio/Gelasio-SemiBold.ttf
          weight: 600
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Regular.ttf
        - asset: assets/fonts/geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/geist/Geist-SemiBold.ttf
          weight: 600

# Regenerate the platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#0E5E4A"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
